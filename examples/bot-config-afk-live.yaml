# AFK Journey — LIVE bot config for Spectre (verified offsets, BlueStacks)
# Usage:
#   spectre bot examples/bot-config-afk-live.yaml --dry-run
#   spectre -v bot examples/bot-config-afk-live.yaml --adb --once
#   spectre -v bot examples/bot-config-afk-live.yaml --adb
#
# Verified live 2026-10-31:
#   - team_power  (base+0xA578) = 259850, matches the "259K" HUD number.
#   - AFK idle-reward claim tap sequence (proven live: AFK timer reset
#     05:38:40 -> 00:00:02 after the claim):
#       tap AFK progress (70,1032) -> tap chest (975,760) -> tap Claim (960,602)
#       -> tap back (474,1010) to return to the homestead view.
#   - afk_pool_gold/afk_pool_exp offsets are STALE (heap layout moved after
#     a restart) and are therefore NOT used here. gold is still unpinned.
# Heap base 0x724DF0000000 is ASLR: it changes per app start. Set the
# current base in metadata.heap_base (find it with `spectre regions <pid>`
# = the big rw- anonymous region, or re-verify with `spectre hot`).
#
# --adb is REQUIRED: the game runs inside BlueStacks, so memory reads go
# through the ADB reader and clicks through `adb shell input`.

metadata:
  game: afk-journey
  process: farlightgames        # inside the emulator: package name match
  pid: 7529                     # current game PID (update after restart: spectre find igame --adb)
  heap_base: 0x724DF0000000     # current hot-heap base (update after restart; ASLR!)
  offsets: examples/afk-offsets-live.yaml

input_backend: adb
enabled: true
default_interval_ms: 300000     # tasks without interval_ms/schedule: every 5 min
memory_poll_ms: 250

tasks:
  # a) Claim the AFK idle chest (gold + exp + essence) with real adb taps.
  #    Guarded on team_power being plausible so a dead/stale pid never
  #    produces blind taps.
  - name: claim_afk
    enabled: true
    interval_ms: 900000         # every 15 min (chest accrues continuously)
    conditions:
      - field: team_power
        op: Gt
        value: !I64 100000
    actions:
      - !Log
        message: "claim_afk: start (team_power plausible) — resetting UI to world view"
        level: Info
      - !InputClick
        x: 474
        y: 1010
      - !Wait
        millis: 1200
      - !InputClick
        x: 474
        y: 1010
      - !Wait
        millis: 1200
      - !InputClick
        x: 300
        y: 250
      - !Wait
        millis: 800
      - !InputClick
        x: 60
        y: 1036
      - !Wait
        millis: 3000
      - !InputClick
        x: 975
        y: 760
      - !Wait
        millis: 2200
      - !InputClick
        x: 960
        y: 602
      - !Wait
        millis: 1800
      - !InputClick
        x: 474
        y: 1010
      - !Log
        message: "claim_afk: tap sequence done (AFK chest claimed, panel closed)"
        level: Info

  # b) Idle check — read team power every 5 min on the clock and log it.
  - name: idle_check
    enabled: true
    schedule: "*/5 * * * *"
    conditions: []
    actions:
      - !MemoryCheck
        field: team_power
        op: GtEq
        value: !I64 100000
      - !Log
        message: "idle_check: team_power read OK (verified anchor, live heap)"
        level: Info