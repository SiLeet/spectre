# AFK Journey — Memory Offset Definitions
# Game version: 1.0.45
#
# STATUS: structures below marked PLACEHOLDER have FAKE base offsets
# (0x...000 patterns) and are NOT valid. Real measurements 2026-10-31:
#   - hot heap base (process start): 0x724DF0000000 (ASLR, changes per start)
#   - team_power VERIFIED LIVE via spectre hot (2026-11-01, commit 97b32ee):
#     on-device scan for pattern 0a f7 03 00 (259850) resolves to exactly
#     base+0xA578. HUD "259K" = POWER (Wappen-Icon), NOT gold.
#   - (10-31 note "gold raw value SMALL ~9.963" superseded by T116, see below.)
