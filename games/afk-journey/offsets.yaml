# UNVERIFIED entries need an action-diff (short interval!) before use.
#
# T110 audit (2026-11-05, docs/reports/memory-first-audit.md):
#   - Offsets here are PER PROCESS. team_power moved I64 @0xA578 (10-31) ->
#     u32 map entry @0x2FE8 / 0x1BD838 -> u64 display copy (width 8, no
#     map-entry shape) @0x4A728 (pid 4039, 11-04). The
#     static entry below is STALE for any current process; the bot reads the
#     relocated slot via scripts/afk_memory.py (power-state.json + drift guard).
#   - `min`/`max` = read-batch sanity range (out of range -> valid:false).
#   - gold (T116, Hermes live 2026-11-05, pid 4039): HOMESTEAD gold (Requests
#     panel / Spire dialog, 654,398) is a u32 at gold-region base + 0x7518C8,
#     mirrored as u64 at the same address -> Homestead.gold below. Proof:
#     u32 scan 653198 -> exactly 1 hit 0x7607b07518c8; later direct read
#     654398 = Spire dialog "654.398"; search --continue 654398 -> still the
#     only hit (one process). The gold region (0x7607b0000000) is NOT the
#     power heap (0x7607E0000000); expected to move per process (ASLR). Supersedes T23 "server-side"
#     and the old "gold @0x0". Hero gold (8.57M) is a different value, not pinned.
#     Restart check (same offset after a new pid) still open.
#   - afk_pool_*: STALE since the 10-31 restart (never re-found).
#
# !! team_power: ALWAYS read via scripts/afk_memory.py power() (relocation +
#    drift guard). The Resources.team_power slot below is only a DUMP-DIFF
#    reference: read-batch with this yaml address returns "read failed" (stale
#    base/slot) - confirmed live by Hermes 2026-11-05 (T113).

