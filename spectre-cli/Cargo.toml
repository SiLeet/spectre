[package]
name = "spectre-cli"
description = "Spectre CLI tool for memory scanning and bot control"
version = "0.1.0"
edition = "2024"

[dependencies]
spectre-core = { workspace = true }
spectre-adb = { workspace = true }
spectre-native = { workspace = true }
spectre-game = { workspace = true }
spectre-bot = { workspace = true }
# spectre-lua is intentionally NOT linked: the workspace mlua dependency has no
# Lua feature enabled (mlua-sys fails to build) and the CLI has no script
# command yet. Re-add `spectre-lua = { workspace = true }` once spectre-lua
# builds with an enabled Lua feature.
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"
tokio = { workspace = true }
structopt = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_yaml = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "spectre"
path = "src/main.rs"