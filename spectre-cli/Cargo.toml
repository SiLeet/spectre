[package]
name = "spectre-cli"
description = "Spectre CLI tool for memory scanning and bot control"
version = "0.2.0"
edition = "2024"

[dependencies]
spectre-core = { workspace = true }
spectre-adb = { workspace = true }
spectre-native = { workspace = true }
spectre-game = { workspace = true }
spectre-bot = { workspace = true }
spectre-lua = { workspace = true }
# Lua backend is provided by spectre-lua's mlua features (lua54 + vendored).
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"
tokio = { workspace = true }
structopt = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_yaml = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "spectre"
path = "src/main.rs"